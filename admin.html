<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lina Nail 後台</title>
    <style>
        :root { --bg-color: #FFFBF0; --header-bg: #EFEBE9; --text-main: #4E342E; --text-sub: #8D6E63; --card-bg: #FFFFFF; --accent-color: #A1887F; --success: #4CAF50; --booked: #E57373; --closed: #9E9E9E; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 16px; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-color); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: #fff; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(141, 110, 99, 0.15); text-align: center; }
        .login-input { padding: 12px; font-size: 1.2rem; margin: 20px 0; border: 1px solid #ccc; border-radius: 8px; width: 100%; text-align: center; }
        header { position: sticky; top: 0; z-index: 1000; background-color: var(--header-bg); padding: 10px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .nav-scroller { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
        .nav-btn { background: #fff; border: 1px solid #ccc; color: var(--text-sub); padding: 8px 12px; cursor: pointer; font-size: 0.9rem; font-weight: bold; border-radius: 20px; display: flex; align-items: center; white-space: nowrap; }
        .nav-btn.active { background-color: var(--text-main); color: #fff; border-color: var(--text-main); }
        .btn-home { text-decoration: none; font-weight: bold; color: var(--text-main); font-size: 0.9rem; border: 1px solid var(--text-main); padding: 5px 10px; border-radius: 8px; }
        main { flex: 1; padding: 15px; padding-bottom: 80px; }
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
        .card-container { display: flex; flex-direction: column; gap: 15px; }
        .data-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.03); position: relative; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .app-card-header { display: flex; justify-content: space-between; font-weight: 900; font-size: 1.1rem; color: var(--text-main); margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .app-card-body { font-size: 0.95rem; line-height: 1.5; color: #555; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--text-main); color: #fff; width: 100%; margin-bottom: 15px; padding: 12px; font-weight: bold; }
        .btn-edit { background: #fff; border: 1px solid var(--accent-color); color: var(--accent-color); }
        .btn-del { background: #fff; border: 1px solid var(--danger); color: var(--danger); font-weight: bold; }
        .btn-secondary { background: #eee; color: #555; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { background: #fff; border: 1px solid #eee; min-height: 80px; padding: 5px; cursor: pointer; border-radius: 6px; position: relative; }
        .cal-day.today { background: #FFF8E1; border: 2px solid #FFD54F; }
        .cal-badge { display: block; font-size: 0.75rem; background: var(--accent-color); color: #fff; padding: 2px; border-radius: 3px; margin-top: 2px; text-align: center; overflow: hidden; white-space: nowrap; }
        /* 時段按鈕 */
        .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .slot-btn { padding: 10px 2px; border-radius: 6px; text-align: center; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: 1px solid #ddd; }
        .slot-btn.open { background: var(--success); color: white; border-color: var(--success); }
        .slot-btn.closed { background: var(--closed); color: white; border-color: var(--closed); }
        .slot-btn.booked { background: var(--booked); color: white; cursor: not-allowed; opacity: 0.6; }
        
        .settings-tab-nav { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px; overflow-x: auto; }
        .settings-tab-btn { background: none; border: none; padding: 5px 10px; cursor: pointer; font-size: 0.95rem; color: #888; white-space: nowrap; }
        .settings-tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--text-main); }
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fff; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(18px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal.open { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-sub); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; outline:none; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="loadingOverlay"><div class="spinner"></div><p style="margin-top: 15px; font-weight: bold; color: #555;">處理中...</p></div>
    <div id="loginOverlay"><div class="login-box"><h2>Lina Nail 後台</h2><input type="password" id="adminPassInput" class="login-input" placeholder="請輸入密碼"><button class="btn btn-primary" onclick="checkLogin()">登入</button></div></div>

    <header>
        <div class="nav-scroller">
            <button class="nav-btn active" onclick="switchPage('dashboard')">首頁</button>
            <button class="nav-btn" onclick="switchPage('appointments')">行事曆</button>
            <button class="nav-btn" onclick="switchPage('booking_settings')">預約設定</button>
            <button class="nav-btn" onclick="switchPage('price_settings')">價目表</button>
            <button class="nav-btn" onclick="switchPage('members')">會員</button>
            <button class="nav-btn" onclick="switchPage('transactions')">消費</button>
        </div>
        <a href="index.html" class="btn-home">回前台</a>
    </header>

    <main>
        <div id="dashboard" class="page-section active">
            <h2 id="todayDateStr">今日預約</h2>
            <div id="today-list" class="card-container"></div>
        </div>

        <div id="appointments" class="page-section">
            <div class="calendar-header">
                <button class="btn btn-secondary" onclick="changeMonth(-1)">◀</button>
                <span id="cal-month-title"></span>
                <button class="btn btn-secondary" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-view"></div>
            <p style="text-align:center; color:#888; font-size:0.9rem; margin-top:10px;">點擊日期管理時段</p>
        </div>

        <div id="booking_settings" class="page-section">
            <div class="data-card" style="margin-bottom:20px; background:#e8f5e9;">
                <h3>🛠️ 系統初始化</h3>
                <p style="margin-bottom:10px; color:#555;">匯入預設服務項目 (資料不見請按此)</p>
                <button class="btn btn-primary" onclick="initServices()">匯入預設項目</button>
            </div>
            <h3>⚙️ 預約項目管理 (工時/開關)</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', 'booking', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', 'booking', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', 'booking', this)">除毛</button>
                <button class="settings-tab-btn" onclick="renderSettings('event', 'booking', this)">活動</button>
            </div>
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px;" onclick="openAddServiceModal()">+ 新增項目</button>
            <div id="booking-settings-list"></div>
        </div>

        <div id="price_settings" class="page-section">
            <h3>💰 價目表管理 (名稱/價格)</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', 'price', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', 'price', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', 'price', this)">除毛</button>
                <button class="settings-tab-btn" onclick="renderSettings('event', 'price', this)">活動</button>
            </div>
            <button class="btn btn-primary" style="width:100%; margin-bottom:15px;" onclick="openAddServiceModal()">+ 新增項目</button>
            <div id="price-settings-list"></div>
        </div>

        <div id="members" class="page-section">
            <button class="btn btn-primary" onclick="openMemberModal()">+ 新增會員</button>
            <input type="text" class="login-input" style="width:100%; text-align:left; margin-bottom:15px;" id="memSearch" placeholder="搜尋..." oninput="renderMembers()">
            <div id="member-list" class="card-container"></div>
        </div>

        <div id="transactions" class="page-section">
            <button class="btn btn-primary" onclick="openTxModal()">+ 新增消費</button>
            <div id="tx-list" class="card-container"></div>
        </div>
    </main>

    <div id="commonModal" class="modal"><div class="modal-content" id="modalBody"></div></div>

    <div id="addServiceModal" class="modal">
        <div class="modal-content">
            <h3>新增項目</h3>
            <div class="form-group"><label>分類</label><select id="new-svc-cat"><option value="nail">美甲</option><option value="skin">肌膚</option><option value="wax">除毛</option><option value="nail-event">美甲活動</option><option value="skin-event">肌膚活動</option><option value="wax-event">除毛活動</option></select></div>
            <div class="form-group"><label>群組 (前台分類)</label><select id="new-svc-group"><option value="nail-basic">美甲-基礎</option><option value="nail-ext">美甲-延甲</option><option value="nail-style">美甲-款式</option><option value="nail-care">美甲-保養</option><option value="skin-basic">肌膚-一般</option><option value="skin-high">肌膚-高階</option><option value="wax-body">除毛-身體</option><option value="wax-private">除毛-私密</option><option value="event">活動</option></select></div>
            <div class="form-group"><label>名稱</label><input type="text" id="new-svc-name"></div>
            <div class="form-group"><label>價格</label><input type="text" id="new-svc-price"></div>
            <div class="form-group"><label>工時 (小時)</label><input type="number" step="0.5" id="new-svc-duration" value="2"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('addServiceModal')">取消</button><button class="btn btn-primary" onclick="saveNewService()">新增</button></div>
        </div>
    </div>

    <div id="editServiceModal" class="modal">
        <div class="modal-content">
            <h3>編輯項目</h3>
            <input type="hidden" id="edit-id">
            <div class="form-group"><label>名稱</label><input type="text" id="edit-name"></div>
            <div class="form-group" id="grp-price"><label>價格</label><input type="text" id="edit-price"></div>
            <div class="form-group" id="grp-duration"><label>工時 (小時)</label><input type="number" step="0.5" id="edit-duration"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('editServiceModal')">取消</button><button class="btn btn-primary" onclick="saveServiceEdit()">儲存</button></div>
        </div>
    </div>
    
    <div id="appModal" class="modal"><div class="modal-content"><h3>預約資訊</h3><input type="hidden" id="app-id"><input type="hidden" id="app-date-hidden"><div class="form-group"><label>狀態</label><select id="app-status"><option value="待確認">待確認</option><option value="已確認">已確認</option><option value="已取消">已取消</option></select></div><div class="form-group"><label>日期</label><input type="text" id="app-date-display" disabled></div><div class="form-group"><label>時間</label><input type="time" id="app-time"></div><div class="form-group"><label>姓名</label><input type="text" id="app-name"></div><div class="form-group"><label>電話</label><input type="text" id="app-phone"></div><div class="form-group"><label>項目</label><textarea id="app-item" rows="3"></textarea></div><div class="form-group"><label>備註</label><input type="text" id="app-note"></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteCurrentApp()">刪除</button><div style="display:flex; gap:10px;"><button class="btn btn-secondary" onclick="closeModal('appModal')">取消</button><button class="btn btn-primary" onclick="saveCurrentApp()">儲存</button></div></div></div></div>
    
    <div id="memberModal" class="modal"><div class="modal-content"><h3>會員</h3><input type="hidden" id="mem-id"><div class="form-group"><label>姓名</label><input id="mem-name"></div><div class="form-group"><label>電話</label><input id="mem-phone"></div><div class="form-group"><label>性別</label><select id="mem-gender"><option>女</option><option>男</option></select></div><div class="form-group"><label>生日 (例 2025/2/1)</label><input type="text" id="mem-bday"></div><div class="form-group"><label>等級</label><select id="mem-level"><option>一般會員</option><option>黃金會員</option><option>白金會員</option><option>鑽石會員</option></select></div><div class="form-group"><label>剩餘課程</label><textarea id="mem-courses"></textarea></div><div class="form-group"><label>黑名單</label><label class="switch"><input type="checkbox" id="mem-blacklist"><span class="slider"></span></label></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteMember()">刪除</button><button class="btn btn-primary" onclick="saveMember()">儲存</button></div></div></div>
    
    <div id="txModal" class="modal"><div class="modal-content"><h3>消費紀錄</h3><input type="hidden" id="tx-id"><div class="form-group"><label>日期</label><input type="date" id="tx-date-edit"></div><div class="form-group"><label>類型</label><select id="tx-type-edit"><option>消費</option><option>儲值</option><option>購買課程</option><option>使用課程</option><option>產品</option></select></div><div class="form-group"><label>項目</label><input id="tx-item-edit"></div><div class="form-group"><label>金額</label><input type="number" id="tx-amt-edit"></div><div class="form-group"><label>備註</label><input id="tx-note-edit"></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteTxById()">刪除</button><button class="btn btn-primary" onclick="saveTxEdit()">儲存</button></div></div></div>

                postData('setHoliday', '', {date: date}).then(() => openDayView(date));
            }
        }
        
        // Update Calendar Modal
        function openDayView(date) {
            const blocks = db.blockedSlots.filter(b => String(b.date) === date);
            const bookedApps = db.appointments.filter(a => a.date === date && a.status !== '已取消');
            const daily = db.dailySettings.find(s => s.date === date);
            const isHoliday = blocks.some(b => b.title === '公休');

            let html = `<h3>${formatDisplayDate(date)} 管理</h3>`;
            
            if(isHoliday) {
                html += `<div style="text-align:center; padding:20px; background:#ffebee; border-radius:8px; margin-bottom:15px; color:#d32f2f; font-weight:bold;">今日已設為公休</div>`;
            } else {
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <button class="btn btn-del" onclick="setHoliday('${date}')">設為公休</button>
                </div>
                <div class="slot-grid">
                    ${renderSlotButton(date, '08:00', blocks, bookedApps, daily?.open800)}
                    ${renderSlotButton(date, '20:30', blocks, bookedApps, daily?.open2030)}
                </div>
                <hr><div class="slot-grid">`;
                let time = 10 * 60; const endTime = 18 * 60;
                while(time <= endTime) {
                    const hh = Math.floor(time/60).toString().padStart(2,'0');
                    const mm = (time%60).toString().padStart(2,'0');
                    html += renderSlotButton(date, `${hh}:${mm}`, blocks, bookedApps, true);
                    time += 30;
                }
                html += `</div>`;
            }
            
            // List Apps

                 });
            } else { html += `<p style="color:#999">無預約</p>`; }
            
            html += `<hr style="margin:20px 0;"><div style="display:flex; justify-content:space-between;"><button class="btn btn-secondary" onclick="closeModal()">返回</button><button class="btn btn-primary" onclick="showManualAdd('${date}')">手動新增</button></div>`;
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('commonModal').classList.add('open');
        }
