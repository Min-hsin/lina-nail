<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lina nail 莉娜時尚館</title>
    <style>
         /* 請貼上您最原始、最喜歡的那份 CSS 樣式，包含 grid-3, removal-box 等 */
         /* 為了確保功能正常，這裡列出關鍵 CSS */
         :root { --bg-color: #F9F7F2; --card-bg: #FFFFFF; --primary-text: #5D4037; --accent-color: #BCAAA4; }
         body { background-color: var(--bg-color); color: var(--primary-text); padding-top: 60px; }
         .tab-content { display: none; } .tab-content.active { display: block; }
         .card { background: #fff; padding: 20px; border-radius: 12px; margin: 15px; }
         /* 您的原始表格樣式 */
         .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 5px; padding: 10px 0; border-bottom: 1px dashed #e0e0e0; }
         .grid-header { background: #EFEBE9; font-weight: bold; }
         .section-title { background: #FDFBF9; padding: 8px; text-align: center; font-weight: bold; margin: 20px 0 10px; }
         /* Booking */
         .nail-sub-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
         .nail-sub-btn { flex: 1; padding: 10px; border: 1px solid #ccc; text-align: center; cursor: pointer; }
         .nail-sub-btn.active { background: var(--accent-color); color: white; }
    </style>
</head>
<body>
    <section id="pricing" class="card">
        <h2>服務價目表</h2>
        <div class="tab-nav">
             <button class="tab-btn active" onclick="showTab('nail', this)">美甲</button>
             <button class="tab-btn" onclick="showTab('skin', this)">肌膚管理</button>
             <button class="tab-btn" onclick="showTab('wax', this)">熱蠟除毛</button>
        </div>

        <div id="nail" class="tab-content active">
            <div class="section-title">凝膠指甲</div>
            <div class="grid-3 grid-header"><div>項目</div><div>手</div><div>足</div></div>
            <div id="price-nail-basic-container"></div>
            
            <div class="section-title">造型設計</div>
            <div id="price-nail-style-container"></div>

            <div class="section-title">保養護理</div>
            <div id="price-nail-care-container"></div>
        </div>

        <div id="skin" class="tab-content">
             <div class="section-title">一般課程</div>
             <div id="price-skin-basic-container"></div>
             <div class="section-title">高階課程</div>
             <div id="price-skin-high-container"></div>
        </div>
        
        </section>

    <section id="booking" class="card">
         <h2>快速預約</h2>
         <div id="srv-nail" class="srv-group">
              <div class="nail-sub-tabs">
                  <div class="nail-sub-btn active" onclick="switchNailSub('hand')">手部</div>
                  <div class="nail-sub-btn" onclick="switchNailSub('foot')">足部</div>
              </div>
              <div id="nail-hand-options">
                   </div>
              <div id="nail-foot-options" style="display:none;">
                   </div>
         </div>
    </section>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzDwyByp3GSfOE8w14yHhXiFI-jjD2tjN_xYmjD7YR1ADfAN1Mcg_esb55bKBCm27HhJA/exec';
        let db = { services: [] };

        async function initDB() {
            const res = await fetch(GAS_URL + '?action=getAll');
            db = await res.json();
            renderPricing();
            renderBookingOptions();
        }
        window.onload = initDB;

        // ★ 核心邏輯：把後台資料「填空」進前台的格子裡
        function renderPricing() {
            // 凝膠 (手/足合併顯示的邏輯比較複雜，這裡示範清單式，或依您的需求特製)
            // 假設後台有 "手-透明" 和 "足-透明"，我們要在同一行顯示
            // 為了簡單且動態，我們將依賴 'group' 欄位
            
            renderGroup('nail', 'nail-style', 'price-nail-style-container');
            renderGroup('skin', 'skin-basic', 'price-skin-basic-container');
            // ... 其他 group
        }

        function renderGroup(cat, group, containerId) {
            const container = document.getElementById(containerId);
            if(!container) return;
            const items = db.services.filter(s => s.cat === cat && s.group === group && s.active === 'true');
            
            // 這裡可以根據 CSS 需求決定 HTML 結構
            // 如果是 grid-3 (項目 | 手 | 足)，則需要特殊的名稱對應邏輯
            // 簡單版：直接列出
            items.forEach(s => {
                container.innerHTML += `<div class="list-row"><span>${s.name}</span><span>${s.price}</span></div>`;
            });
        }

        function renderBookingOptions() {
             const handOpts = document.getElementById('nail-hand-options');
             const footOpts = document.getElementById('nail-foot-options');
             
             db.services.filter(s => s.cat === 'nail' && s.active === 'true').forEach(s => {
                 const html = `<label><input type="checkbox" value="${s.name}"> ${s.name}</label><br>`;
                 if(s.name.includes('手')) handOpts.innerHTML += html;
                 if(s.name.includes('足')) footOpts.innerHTML += html;
             });
        }
        
        function switchNailSub(part) {
            document.getElementById('nail-hand-options').style.display = (part==='hand')?'block':'none';
            document.getElementById('nail-foot-options').style.display = (part==='foot')?'block':'none';
             // 切換 Tab 樣式...
        }
    </script>
</body>
</html>
