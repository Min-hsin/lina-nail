<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lina Nail 後台</title>
    <style>
        :root { --bg-color: #FFFBF0; --header-bg: #EFEBE9; --text-main: #4E342E; --text-sub: #8D6E63; --card-bg: #FFFFFF; --accent-color: #A1887F; --success: #4CAF50; --booked: #E57373; --closed: #9E9E9E; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 16px; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .icon { width: 22px; height: 22px; fill: currentColor; vertical-align: middle; margin-right: 5px; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-color); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: #fff; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        .login-input { padding: 12px; font-size: 1.2rem; margin: 20px 0; border: 1px solid #ccc; border-radius: 8px; width: 100%; text-align: center; }
        header { position: sticky; top: 0; z-index: 1000; background-color: var(--header-bg); padding: 10px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .nav-scroller { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
        .nav-btn { background: #fff; border: 1px solid #ccc; color: var(--text-sub); padding: 8px 12px; cursor: pointer; font-size: 0.9rem; font-weight: bold; border-radius: 20px; display: flex; align-items: center; white-space: nowrap; }
        .nav-btn.active { background-color: var(--text-main); color: #fff; border-color: var(--text-main); }
        .btn-home { text-decoration: none; font-weight: bold; color: var(--text-main); font-size: 0.9rem; border: 1px solid var(--text-main); padding: 5px 10px; border-radius: 8px; }
        main { flex: 1; padding: 15px; padding-bottom: 80px; }
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
        .card-container { display: flex; flex-direction: column; gap: 15px; }
        .data-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.03); position: relative; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { font-size: 1.1rem; margin-bottom: 15px; }
        .app-card-header { display: flex; justify-content: space-between; font-weight: 900; font-size: 1.1rem; color: var(--text-main); margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 8px; }
        .app-card-body { font-size: 0.95rem; line-height: 1.5; color: #555; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--text-main); color: #fff; width: 100%; margin-bottom: 15px; padding: 12px; font-weight: bold; }
        .btn-edit { background: #fff; border: 1px solid var(--accent-color); color: var(--accent-color); }
        .btn-del { background: #fff; border: 1px solid var(--danger); color: var(--danger); font-weight: bold; }
        .btn-secondary { background: #eee; color: #555; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { background: #fff; border: 1px solid #eee; min-height: 80px; padding: 5px; cursor: pointer; border-radius: 6px; position: relative; }
        .cal-day.today { background: #FFF8E1; border: 2px solid #FFD54F; }
        .cal-badge { display: block; font-size: 0.75rem; background: var(--accent-color); color: #fff; padding: 2px; border-radius: 3px; margin-top: 2px; text-align: center; overflow: hidden; white-space: nowrap; }
        .cal-badge.blocked { background: #BDBDBD; } 
        /* 時段按鈕 */
        .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .slot-btn { padding: 10px 2px; border-radius: 6px; text-align: center; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: 1px solid #ddd; }
        .slot-btn.open { background: var(--success); color: white; border-color: var(--success); }
        .slot-btn.closed { background: var(--closed); color: white; border-color: var(--closed); }
        .slot-btn.booked { background: var(--booked); color: white; cursor: not-allowed; opacity: 0.6; }
        
        .settings-tab-nav { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px; overflow-x: auto; }
        .settings-tab-btn { background: none; border: none; padding: 5px 10px; cursor: pointer; font-size: 0.95rem; color: #888; white-space: nowrap; }
        .settings-tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--text-main); }
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fff; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(18px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal.open { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-sub); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; outline:none; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="loadingOverlay"><div class="spinner"></div><p style="margin-top: 15px; font-weight: bold; color: #555;">處理中...</p></div>
    <div id="loginOverlay"><div class="login-box"><h2>Lina Nail 後台</h2><input type="password" id="adminPassInput" class="login-input" placeholder="請輸入密碼"><button class="btn btn-primary" onclick="checkLogin()">登入</button></div></div>

    <header>
        <div class="nav-scroller">
            <button class="nav-btn active" onclick="switchPage('dashboard')">首頁</button>
            <button class="nav-btn" onclick="switchPage('appointments')">行事曆</button>
            <button class="nav-btn" onclick="switchPage('booking_settings')">預約設定</button>
            <button class="nav-btn" onclick="switchPage('price_settings')">價目表</button>
            <button class="nav-btn" onclick="switchPage('members')">會員</button>
            <button class="nav-btn" onclick="switchPage('transactions')">消費</button>
        </div>
        <a href="index.html" class="btn-home">回前台</a>
    </header>

    <main>
        <div id="dashboard" class="page-section active">
            <h2 id="todayDateStr">今日預約</h2>
            <div id="today-list" class="card-container"></div>
        </div>

        <div id="appointments" class="page-section">
            <div class="calendar-header">
                <button class="btn btn-secondary" onclick="changeMonth(-1)">◀</button>
                <span id="cal-month-title"></span>
                <button class="btn btn-secondary" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-view"></div>
            <p style="text-align:center; color:#888; font-size:0.9rem; margin-top:10px;">點擊日期管理時段</p>
        </div>

        <div id="booking_settings" class="page-section">
            <div class="data-card" style="margin-bottom:20px; background:#e8f5e9;">
                <h3>🛠️ 系統初始化</h3>
                <p style="margin-bottom:10px; color:#555;">匯入包含ID的預設資料 (若前台空白請按此)</p>
                <button class="btn btn-primary" onclick="initServices()">匯入預設項目</button>
            </div>
            <h3>⚙️ 預約項目管理 (開關/工時)</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', 'booking', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', 'booking', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', 'booking', this)">除毛</button>
                <button class="settings-tab-btn" onclick="renderSettings('event', 'booking', this)">活動</button>
            </div>
            <div id="booking-settings-list"></div>
        </div>

        <div id="price_settings" class="page-section">
            <h3>💰 價目表管理 (名稱/價格)</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', 'price', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', 'price', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', 'price', this)">除毛</button>
            </div>
            <div id="price-settings-list"></div>
        </div>

        <div id="members" class="page-section">
            <button class="btn btn-primary" onclick="openMemberModal()">+ 新增會員</button>
            <input type="text" class="login-input" style="width:100%; text-align:left; margin-bottom:15px;" id="memSearch" placeholder="搜尋..." oninput="renderMembers()">
            <div id="member-list" class="card-container"></div>
        </div>

        <div id="transactions" class="page-section">
            <button class="btn btn-primary" onclick="openTxModal()">+ 新增消費</button>
            <div id="tx-list" class="card-container"></div>
        </div>
    </main>

    <div id="commonModal" class="modal"><div class="modal-content" id="modalBody"></div></div>

    <div id="editServiceModal" class="modal">
        <div class="modal-content">
            <h3>編輯項目</h3>
            <input type="hidden" id="edit-id">
            <div class="form-group"><label>名稱</label><input type="text" id="edit-name"></div>
            <div class="form-group" id="grp-price"><label>價格</label><input type="text" id="edit-price"></div>
            <div class="form-group" id="grp-duration"><label>工時 (小時)</label><input type="number" step="0.5" id="edit-duration"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('editServiceModal')">取消</button><button class="btn btn-primary" onclick="saveServiceEdit()">儲存</button></div>
        </div>
    </div>
    
    <div id="appModal" class="modal"><div class="modal-content"><h3>預約資訊</h3><input type="hidden" id="app-id"><input type="hidden" id="app-date-hidden"><div class="form-group"><label>狀態</label><select id="app-status"><option value="待確認">待確認</option><option value="已確認">已確認</option><option value="已取消">已取消</option></select></div><div class="form-group"><label>日期</label><input type="text" id="app-date-display" disabled></div><div class="form-group"><label>時間</label><input type="time" id="app-time"></div><div class="form-group"><label>姓名</label><input type="text" id="app-name"></div><div class="form-group"><label>電話</label><input type="text" id="app-phone"></div><div class="form-group"><label>項目</label><textarea id="app-item" rows="3"></textarea></div><div class="form-group"><label>備註</label><input type="text" id="app-note"></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteCurrentApp()">刪除</button><div style="display:flex; gap:10px;"><button class="btn btn-secondary" onclick="closeModal('appModal')">取消</button><button class="btn btn-primary" onclick="saveCurrentApp()">儲存</button></div></div></div></div>
    <div id="memberModal" class="modal"><div class="modal-content"><h3>會員</h3><input type="hidden" id="mem-id"><div class="form-group"><label>姓名</label><input id="mem-name"></div><div class="form-group"><label>電話</label><input id="mem-phone"></div><div class="form-group"><label>性別</label><select id="mem-gender"><option>女</option><option>男</option></select></div><div class="form-group"><label>生日 (例 2025/2/1)</label><input type="text" id="mem-bday"></div><div class="form-group"><label>等級</label><select id="mem-level"><option>一般會員</option><option>黃金會員</option><option>白金會員</option><option>鑽石會員</option></select></div><div class="form-group"><label>剩餘課程</label><textarea id="mem-courses"></textarea></div><div class="form-group"><label>黑名單</label><label class="switch"><input type="checkbox" id="mem-blacklist"><span class="slider"></span></label></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteMember()">刪除</button><button class="btn btn-primary" onclick="saveMember()">儲存</button></div></div></div>
    <div id="txModal" class="modal"><div class="modal-content"><h3>消費紀錄</h3><input type="hidden" id="tx-id"><div class="form-group"><label>日期</label><input type="date" id="tx-date-edit"></div><div class="form-group"><label>類型</label><select id="tx-type-edit"><option>消費</option><option>儲值</option><option>購買課程</option><option>使用課程</option><option>產品</option></select></div><div class="form-group"><label>項目</label><input id="tx-item-edit"></div><div class="form-group"><label>金額</label><input type="number" id="tx-amt-edit"></div><div class="form-group"><label>備註</label><input id="tx-note-edit"></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteTxById()">刪除</button><button class="btn btn-primary" onclick="saveTxEdit()">儲存</button></div></div></div>

        let db = { members: [], transactions: [], appointments: [], services: [], blockedSlots: [], dailySettings: [] };

        function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }
        async function fetchData() { showLoading(true); try { const res = await fetch(GAS_URL + '?action=getAll'); db = await res.json(); init(); } catch(e) { alert("連線失敗"); } showLoading(false); }
        async function postData(action, sheet, dataObj, id=null, extra={}) { showLoading(true); const payload = { action: action, sheet: sheet, data: dataObj, id: id, ...extra }; await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) }); await fetchData(); showLoading(false); }
        
        function getTodayString() { return new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replace(/\//g, '-'); }
        function formatDisplayDate(dateStr) { if(!dateStr) return ''; try { if(dateStr.includes('-')) { const p = dateStr.split('-'); return `${parseInt(p[0])}/${parseInt(p[1])}/${parseInt(p[2])}`; } return dateStr; } catch(e) { return dateStr; } }
        function clean(val) { return String(val || '').replace(/[^0-9a-zA-Z]/g, '').toLowerCase(); }
        function checkLogin() { if(document.getElementById('adminPassInput').value === '1229') { document.getElementById('loginOverlay').style.display = 'none'; fetchData(); } else alert('密碼錯誤'); }
        function switchPage(pageId) { document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active')); document.getElementById(pageId).classList.add('active'); document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active')); event.currentTarget.classList.add('active'); if(pageId === 'dashboard') renderDashboard(); if(pageId === 'members') renderMembers(); if(pageId === 'transactions') renderTransactions(); if(pageId === 'appointments') renderCalendar(); if(pageId === 'booking_settings' || pageId === 'price_settings') renderSettings(currentSettingsCat, pageId === 'booking_settings' ? 'booking' : 'price'); }
        function init() { renderDashboard(); }

        // Dashboard
        function renderDashboard() {
            const today = getTodayString();
            document.getElementById('todayDateStr').innerText = `今日預約 (${formatDisplayDate(today)})`;
            const list = document.getElementById('today-list');
            list.innerHTML = "";
            const apps = db.appointments.filter(a => a.date === today && a.status !== '已取消').sort((a,b) => a.time.localeCompare(b.time));
            if(apps.length === 0) { list.innerHTML = `<div style="text-align:center; color:#999; padding:20px;">今日無預約</div>`; return; }
            apps.forEach(app => {
                let badgeClass = (app.status === '待確認') ? 'status-pending' : 'status-confirmed';
                list.innerHTML += `<div class="data-card" onclick="openEditAppModal('${app.id}')"><div class="app-card-header"><span>${app.time} <span class="status-badge ${badgeClass}">${app.status || '已確認'}</span></span><span>${app.name}</span></div><div class="app-card-body">項目：${app.item}<br>電話：${app.phone}<br><span class="app-card-note">備註：${app.note||'無'}</span></div><div class="app-card-actions"><button class="btn btn-edit" onclick="event.stopPropagation(); openEditAppModal('${app.id}')">確認/修改</button><button class="btn btn-del" onclick="event.stopPropagation(); deleteCurrentApp('${app.id}')">刪除</button></div></div>`;
            });
        }

        // Calendar & Slots
        let currentMonth = new Date();
        function changeMonth(n) { currentMonth.setMonth(currentMonth.getMonth()+n); renderCalendar(); }
        function renderCalendar() {
            const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
            document.getElementById('cal-month-title').innerText = `${y}年 ${m+1}月`;
            const grid=document.getElementById('calendar-view'); grid.innerHTML="";
            const days = new Date(y, m+1, 0).getDate();
            const first = new Date(y, m, 1).getDay();
            for(let i=0;i<first;i++) grid.innerHTML+=`<div class="cal-day" style="background:transparent;border:none;"></div>`;
            for(let d=1;d<=days;d++) {
                const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                let html=`<div class="cal-day" onclick="openDayView('${dateStr}')"><span style="font-weight:bold;">${d}</span></div>`;
                grid.innerHTML+=html;
            }
        }

        function openDayView(date) {
            const blocks = db.blockedSlots.filter(b => String(b.date) === date && b.title === 'manual_lock');
            const bookedApps = db.appointments.filter(a => a.date === date && a.status !== '已取消');
            const daily = db.dailySettings.find(s => s.date === date);

            let html = `<h3>${formatDisplayDate(date)} 時段管理</h3>
            <div class="slot-grid">
                ${renderSlotButton(date, '08:00', blocks, bookedApps, daily?.open800)}
                ${renderSlotButton(date, '20:30', blocks, bookedApps, daily?.open2030)}
            </div>
            <hr>
            <p style="margin:10px 0; color:#666; font-size:0.8rem;">(綠色=開放 / 灰色=關閉 / 紅色=已約)</p>
            <div class="slot-grid">`;
            
            let time = 10 * 60; // 10:00
            const endTime = 18 * 60; // 18:00
            while(time <= endTime) {
                const hh = Math.floor(time/60).toString().padStart(2,'0');
                const mm = (time%60).toString().padStart(2,'0');
                const timeStr = `${hh}:${mm}`;
                html += renderSlotButton(date, timeStr, blocks, bookedApps, true);
                time += 30;
            }
            html += `</div>`;
            html += `<hr style="margin:20px 0;"><button class="btn btn-primary" onclick="showManualAdd('${date}')">手動新增預約</button>`;
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('commonModal').classList.add('open');
        }

        function renderSlotButton(date, time, blocks, apps, isOpenInDaily) {
            const isBooked = apps.some(a => a.time === time);
            const isBlocked = blocks.some(b => b.start === time);
            // 8:00/20:30 預設關閉(false)，一般時段預設開啟(true)
            const isDailyOpen = (time === '08:00' || time === '20:30') ? (String(isOpenInDaily).toLowerCase()==='true') : true;

            let className = 'slot-btn open';
            let onclick = `toggleSlotState('${date}', '${time}', true)`;

            if (isBooked) {
                className = 'slot-btn booked';
                onclick = '';
            } else if (isBlocked || !isDailyOpen) {
                // 如果是被手動 Block 或是 8:00/20:30 沒開
                className = 'slot-btn closed';
                // 點擊 -> 開啟 (對 8:00 來說是 setDaily，對一般時段是 unblock)
                if (time === '08:00' || time === '20:30') {
                    onclick = `toggleDailyExtra('${date}', '${time}', true)`;
                } else {
                    onclick = `toggleSlotState('${date}', '${time}', false)`;
                }
            } else {
                // 狀態是 Open
                 if (time === '08:00' || time === '20:30') {
                    onclick = `toggleDailyExtra('${date}', '${time}', false)`;
                }
            }
            
            return `<div class="${className}" onclick="${onclick}">${time}</div>`;
        }

        function toggleSlotState(date, time, shouldBlock) {
            showLoading(true);
            const payload = { action: 'toggleSlot', date: date, time: time, block: shouldBlock };
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) }).then(() => {
                fetchData().then(() => openDayView(date));
            });
        }
        
        function toggleDailyExtra(date, time, isOpen) {
            showLoading(true);
            // 讀取當前狀態，只改變點擊的那個
            const daily = db.dailySettings.find(s => s.date === date);
            let o8 = daily ? (String(daily.open800).toLowerCase()==='true') : false;
            let o20 = daily ? (String(daily.open2030).toLowerCase()==='true') : false;
            
            if(time === '08:00') o8 = isOpen;
            if(time === '20:30') o20 = isOpen;
            
            postData('setDaily', '', {date: date, open800: o8, open2030: o20}).then(() => {
                openDayView(date); // Refresh
            });
        }
        
        function showManualAdd(date) {
             const opts = db.members.map(m => `<option value="${m.phone} ${m.name}">`).join('');
             let html = `<h4>${formatDisplayDate(date)} 新增預約</h4>
             <div class="form-group"><input type="time" id="new-app-time"></div>
             <div class="form-group"><label>搜尋會員</label><input list="app-mem-list" id="app-search" oninput="autoFillApp()" style="width:100%"><datalist id="app-mem-list">${opts}</datalist></div>
             <div class="form-group"><input type="text" id="new-app-name" placeholder="姓名"></div>
             <div class="form-group"><input type="tel" id="new-app-phone" placeholder="電話"></div>
             <div class="form-group"><input type="text" id="new-app-item" placeholder="項目"></div>
             <div class="modal-footer"><button class="btn btn-secondary" onclick="openDayView('${date}')">返回</button><button class="btn btn-primary" onclick="addManualApp('${date}')">新增</button></div>`;
             document.getElementById('modalBody').innerHTML = html;
        }

        // Settings
        function renderSettings(cat, mode, btn) {
            currentSettingsMode = mode;
            if(btn) { document.querySelectorAll('.settings-tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
            const list = (mode === 'booking') ? document.getElementById('booking-settings-list') : document.getElementById('price-settings-list');
            list.innerHTML = "";
            const filtered = (cat === 'event') ? db.services.filter(s => s.cat.includes('event')) : db.services.filter(s => s.cat === cat);
            
            filtered.forEach(s => {
                if(mode === 'booking') {
                    list.innerHTML += `<div class="switch-row">
                        <span style="flex:1;">${s.name} <small style="color:#888;">(${s.duration}h)</small></span>
                        <button class="btn-edit" style="padding:2px 8px; margin-right:10px; font-size:0.8rem;" onclick="openServiceModal('${s.id}', 'booking')">工時</button>
                        <label class="switch"><input type="checkbox" ${String(s.active)==='true'?'checked':''} onchange="toggleService('${s.id}', this.checked)"><span class="slider"></span></label>
                    </div>`;
                } else {
                    list.innerHTML += `<div class="switch-row">
                        <span style="flex:1; cursor:pointer;" onclick="openServiceModal('${s.id}', 'price')">${s.name}</span>
                        <span style="margin-right:10px; font-weight:bold;">${s.price||'-'}</span>
                        <button class="btn-edit" style="padding:2px 8px; font-size:0.8rem;" onclick="openServiceModal('${s.id}', 'price')">修改</button>
                    </div>`;
                }
            });
        }
        
        function openServiceModal(id, mode) {
            const s = db.services.find(x => x.id === id);
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = s.name;
            document.getElementById('edit-price').value = s.price;
            document.getElementById('edit-duration').value = s.duration;
            
            document.getElementById('grp-price').style.display = (mode === 'price') ? 'block' : 'none';
            document.getElementById('edit-name').parentElement.style.display = (mode === 'price') ? 'block' : 'none';
            document.getElementById('grp-duration').style.display = (mode === 'booking') ? 'block' : 'none';
            document.getElementById('editServiceModal').classList.add('open');
        }
        
        function saveServiceEdit() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                action: 'updateService', id: id,
                name: document.getElementById('edit-name').value,
                price: document.getElementById('edit-price').value,
                duration: document.getElementById('edit-duration').value
            };
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) }).then(() => { closeModal('editServiceModal'); fetchData(); });
        }
        function toggleService(id, isActive) { fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateService', id: id, active: isActive }) }); }
        function initServices() { if(confirm("確定匯入？")) { const rows = defaultServices.map(s => [s.id, s.cat, s.name, s.price, s.duration, s.active]); postData('initServices', 'services', rows).then(()=>alert("匯入完成")); } }

        // Standard helpers
        function openTxModal() { 
             const modal = document.getElementById('commonModal'); 
             const opts = db.members.map(m => `<option value="${m.phone} ${m.name}">`).join('');
             document.getElementById('modalBody').innerHTML = `<h3>新增消費</h3><div class="form-group"><label>搜尋會員</label><input list="mem-list" id="tx-search" oninput="autoFillMember()" placeholder="電話/姓名"><datalist id="mem-list">${opts}</datalist><input type="hidden" id="tx-mem-val"></div><div class="form-group"><label>日期</label><input type="date" id="tx-date" value="${getTodayString()}"></div><div class="form-group"><label>類型</label><select id="tx-type"><option>消費</option><option>儲值</option><option>購買課程</option><option value="使用課程">使用課程</option><option>產品</option></select></div><div class="form-group"><label>項目</label><input id="tx-item"></div><div class="form-group"><label>金額</label><input type="number" id="tx-amt" value="0"></div><div class="form-group" style="background:#e3f2fd; padding:10px;"><label>💰 連動儲值金 <input type="checkbox" id="tx-update-balance" checked></label></div><div class="form-group"><label>備註</label><input id="tx-note"></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTx()">確認</button></div>`;
             document.getElementById('tx-mem-val').value = ''; 
             modal.classList.add('open');
        }
        function autoFillMember() { const val = document.getElementById('tx-search').value; const m = db.members.find(x => val.includes(x.phone)); if(m) document.getElementById('tx-mem-val').value = m.id; }
        function saveTx() { const memVal = document.getElementById('tx-mem-val').value; if(!memVal) return alert("請選擇會員"); const data = [ Date.now().toString(), document.getElementById('tx-date').value, memVal, document.getElementById('tx-type').value, document.getElementById('tx-item').value, document.getElementById('tx-amt').value, document.getElementById('tx-note').value ]; postData('add', 'transactions', data, null, { updateBalance: document.getElementById('tx-update-balance').checked }).then(()=>closeModal()); }
        function openEditAppModal(id) { const app = db.appointments.find(a => String(a.id) === String(id)); if(!app) return; closeModal('commonModal'); document.getElementById('app-id').value = app.id; document.getElementById('app-status').value = app.status || '已確認'; document.getElementById('app-date-display').value = formatDisplayDate(app.date); document.getElementById('app-date-hidden').value = app.date; document.getElementById('app-time').value = app.time; document.getElementById('app-name').value = app.name; document.getElementById('app-phone').value = app.phone; document.getElementById('app-item').value = app.item; document.getElementById('app-note').value = app.note || ''; document.getElementById('appModal').classList.add('open'); }
        function saveCurrentApp() { const id = document.getElementById('app-id').value; const data = [ id, document.getElementById('app-date-hidden').value, document.getElementById('app-time').value, document.getElementById('app-name').value, document.getElementById('app-phone').value, document.getElementById('app-item').value, document.getElementById('app-note').value, document.getElementById('app-status').value ]; postData('update', 'appointments', data, id).then(()=>closeModal('appModal')); }
        function deleteCurrentApp(id) { if(confirm("刪除？")) postData('delete', 'appointments', null, id).then(() => { closeModal('appModal'); closeModal('commonModal'); }); }
        function addManualApp(date) { const phone = document.getElementById('new-app-phone').value; if(!phone) { alert("請填寫電話"); return; } const data = [ Date.now().toString(), date, document.getElementById('new-app-time').value, document.getElementById('new-app-name').value, phone, document.getElementById('new-app-item').value, "後台手動", "已確認" ]; postData('add', 'appointments', data).then(()=>openDayView(date)); }
        function renderMembers() { /* same */ }
        function deleteTxById() { deleteTx(document.getElementById('tx-id').value); closeModal('txModal'); }
        function deleteTx(id) { if(confirm("刪除？")) postData('delete', 'transactions', null, id, { sheet: 'transactions' }); }
        function openTxEdit(id) { const t = db.transactions.find(x => x.id == id); document.getElementById('tx-id').value = id; document.getElementById('tx-date-edit').value = t.date; document.getElementById('tx-type-edit').value = t.type; document.getElementById('tx-item-edit').value = t.item; document.getElementById('tx-amt-edit').value = t.amount; document.getElementById('tx-note-edit').value = t.note; document.getElementById('txModal').classList.add('open'); }
        function saveTxEdit() { const id = document.getElementById('tx-id').value; const t = db.transactions.find(x => x.id == id); const data = [ id, document.getElementById('tx-date-edit').value, t.memberid, document.getElementById('tx-type-edit').value, document.getElementById('tx-item-edit').value, document.getElementById('tx-amt-edit').value, document.getElementById('tx-note-edit').value ]; postData('update', 'transactions', data, id).then(()=>closeModal('txModal')); }
        function closeModal(id) { document.getElementById(id||'commonModal').classList.remove('open'); }
    </script>
</body>
