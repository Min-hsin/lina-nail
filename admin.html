<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lina Nail 後台管理</title>
    <style>
        :root { --bg-color: #FFFBF0; --header-bg: #EFEBE9; --text-main: #4E342E; --text-sub: #8D6E63; --card-bg: #FFFFFF; --accent-color: #A1887F; --border-color: #D7CCC8; --danger: #D32F2F; --success: #388E3C; --pending: #FBC02D; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 16px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .icon { width: 22px; height: 22px; fill: currentColor; vertical-align: middle; margin-right: 5px; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-color); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: #fff; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(141, 110, 99, 0.15); text-align: center; border: 1px solid var(--border-color); }
        .login-input { padding: 12px; font-size: 1.2rem; margin: 20px 0; border: 1px solid #ccc; border-radius: 8px; width: 100%; text-align: center; outline: none;}
        header { background-color: var(--header-bg); padding: 12px 15px; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .nav-scroller { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
        .nav-scroller::-webkit-scrollbar { display: none; }
        .nav-btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 15px; cursor: pointer; font-size: 0.95rem; font-weight: bold; border-radius: 20px; transition: 0.2s; display: flex; align-items: center; white-space: nowrap; }
        .nav-btn.active { background-color: var(--text-main); color: #fff; border-color: var(--text-main); }
        .btn-home { text-decoration: none; font-weight: bold; color: var(--text-main); font-size: 0.9rem; border: 1px solid var(--text-main); padding: 5px 10px; border-radius: 8px; }
        main { flex: 1; padding: 15px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
        .card-container { display: flex; flex-direction: column; gap: 15px; }
        .data-card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.03); position: relative; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { font-size: 1.2rem; margin-bottom: 15px; }
        .app-card-header { display: flex; justify-content: space-between; font-weight: 900; font-size: 1.2rem; color: var(--text-main); margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
        .app-card-body { font-size: 1rem; line-height: 1.6; color: #555; }
        .app-card-note { color: var(--text-sub); font-weight: bold; margin-top: 5px; display: block;}
        .app-card-actions { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: #fff; margin-left: 5px; }
        .status-pending { background-color: var(--pending); }
        .status-confirmed { background-color: var(--success); }
        .mem-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 10px;}
        .mem-name { font-size: 1.4rem; font-weight: 900; color: var(--text-main); display: block;} 
        .mem-phone { font-size: 1.2rem; font-weight: bold; color: var(--text-main); display: block; margin-top: 5px;} 
        .mem-sub { font-size: 1rem; color: var(--text-sub); margin-bottom: 8px; font-weight: 500; } 
        .mem-detail { font-size: 0.95rem; color: #888; line-height: 1.6; } 
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--text-main); color: #fff; width: 100%; margin-bottom: 15px; padding: 12px; font-weight: bold; }
        .btn-edit { background: #fff; border: 1px solid var(--accent-color); color: var(--accent-color); }
        .btn-del { background: #fff; border: 1px solid var(--danger); color: var(--danger); font-weight: bold; }
        .btn-secondary { background: #eee; color: #555; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day { background: #fff; border: 1px solid #eee; min-height: 100px; padding: 5px; cursor: pointer; border-radius: 6px; position: relative; }
        .cal-day.today { background: #FFF8E1; border: 2px solid #FFD54F; }
        .cal-badge { display: block; font-size: 0.8rem; background: var(--accent-color); color: #fff; padding: 4px; border-radius: 4px; margin-top: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cal-badge.blocked { background: #BDBDBD; font-size: 0.75rem;} 
        .cal-badge.pending { background: var(--pending); color: #333; }
        .settings-tab-nav { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px; overflow-x: auto; }
        .settings-tab-btn { background: none; border: none; padding: 8px 15px; cursor: pointer; font-size: 1rem; color: #888; white-space: nowrap; }
        .settings-tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--text-main); }
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fff; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .switch-row input[type="text"] { font-size: 1.2rem; font-weight: bold; color: var(--text-main); border: none; background: transparent; width: 70%;}
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal.open { display: flex; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-sub); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; outline:none; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loadingOverlay"><div class="spinner"></div><p style="margin-top: 15px; font-weight: bold; color: #555;">資料同步中...</p></div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="border:none; margin-bottom:20px;">Lina Nail 後台</h2>
            <input type="password" id="adminPassInput" class="login-input" placeholder="請輸入密碼">
            <button class="btn btn-primary" onclick="checkLogin()">登入</button>
        </div>
    </div>

    <header>
        <div class="nav-scroller">
            <button class="nav-btn active" onclick="switchPage('dashboard')"><svg class="icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>首頁</button>
            <button class="nav-btn" onclick="switchPage('members')"><svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>會員</button>
            <button class="nav-btn" onclick="switchPage('transactions')"><svg class="icon" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>消費</button>
            <button class="nav-btn" onclick="switchPage('appointments')"><svg class="icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>預約</button>
            <button class="nav-btn" onclick="switchPage('settings')"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>設定</button>
        </div>
        <a href="index.html" class="btn-home">回前台</a>
    </header>

    <main>
        <div id="dashboard" class="page-section active">
            <h2 id="todayDateStr">今日預約</h2>
            <div id="today-list" class="card-container"></div>
        </div>

        <div id="members" class="page-section">
            <button class="btn btn-primary" onclick="openMemberModal()">+ 新增會員</button>
            <input type="text" class="login-input" style="width:100%; text-align:left; margin-bottom:15px;" id="memSearch" placeholder="搜尋姓名或電話..." oninput="renderMembers()">
            <div id="member-list" class="card-container"></div>
        </div>

        <div id="transactions" class="page-section">
            <button class="btn btn-primary" onclick="openTxModal()">+ 新增消費 / 儲值 / 購課</button>
            <div id="tx-list" class="card-container"></div>
        </div>

        <div id="appointments" class="page-section">
            <div class="calendar-header">
                <button class="btn btn-secondary" onclick="changeMonth(-1)">◀</button>
                <span id="cal-month-title"></span>
                <button class="btn btn-secondary" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-view"></div>
            <div style="margin-top:20px;">
                <button class="btn btn-primary" onclick="openBlockTimeModal()" style="background:#757575;">新增保留 / 不開放時段</button>
            </div>
        </div>

        <div id="settings" class="page-section">
            <div class="data-card" style="margin-bottom:20px;">
                <h3>🔒 管理員密碼</h3>
                <p>目前密碼固定為：<strong>1229</strong></p>
            </div>
            <div class="data-card" style="margin-bottom:20px; background:#e8f5e9;">
                <h3>🛠️ 系統初始化</h3>
                <p style="margin-bottom:10px; color:#555;">一鍵匯入預設服務項目</p>
                <button class="btn btn-primary" onclick="initServices()">匯入預設項目</button>
            </div>
            <h3>⚙️ 預約項目管理</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', this)">除毛</button>
                <button class="settings-tab-btn" onclick="renderSettings('nail-event', this)">美甲活動</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin-event', this)">肌膚活動</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax-event', this)">除毛活動</button>
            </div>
            <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
                 <button class="btn btn-primary" style="width:auto; margin:0;" onclick="openAddServiceModal()">+ 新增項目</button>
            </div>
            <div id="service-settings-list"></div>
        </div>
    </main>

    <div id="commonModal" class="modal"><div class="modal-content" id="modalBody"></div></div>

    <div id="appModal" class="modal">
        <div class="modal-content">
            <h3>預約資訊</h3>
            <input type="hidden" id="app-id"><input type="hidden" id="app-date-hidden">
            <div class="form-group"><label>狀態</label><select id="app-status"><option value="待確認">待確認 (前台送來)</option><option value="已確認">已確認 (正式預約)</option><option value="已取消">已取消</option></select></div>
            <div class="form-group"><label>日期</label><input type="text" id="app-date-display" disabled style="background:#eee;"></div>
            <div class="form-group"><label>時間</label><input type="time" id="app-time"></div>
            <div class="form-group"><label>姓名</label><input type="text" id="app-name"></div>
            <div class="form-group"><label>電話</label><input type="text" id="app-phone"></div>
            <div class="form-group"><label>項目</label><textarea id="app-item" rows="3"></textarea></div>
            <div class="form-group"><label>備註</label><input type="text" id="app-note"></div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button class="btn btn-del" onclick="deleteCurrentApp()">刪除預約</button>
                <div style="display:flex; gap:10px;"><button class="btn btn-secondary" onclick="closeModal('appModal')">取消</button><button class="btn btn-primary" style="width:auto; margin:0;" onclick="saveCurrentApp()">儲存</button></div>
            </div>
        </div>
    </div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <h3 id="memModalTitle">新增/修改會員</h3>
            <input type="hidden" id="mem-id">
            <div class="form-group"><label>姓名</label><input id="mem-name"></div>
            <div class="form-group"><label>電話 (例：0912345678)</label><input id="mem-phone"></div>
            <div class="form-group"><label>性別</label><select id="mem-gender"><option>女</option><option>男</option></select></div>
            <div class="form-group"><label>生日 (文字，例: 2005/1/1)</label><input type="text" id="mem-bday" placeholder="請輸入生日"></div>
            <div class="form-group"><label>等級 (對應折扣)</label><select id="mem-level"><option>一般會員</option><option>黃金會員</option><option>白金會員</option><option>鑽石會員</option></select></div>
            <div class="form-group"><label>剩餘課程</label><textarea id="mem-courses" rows="3" placeholder="例如：臉部保養 3 堂"></textarea></div>
            <div class="form-group" style="background:#ffebee; padding:15px; border-radius:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="margin:0; color:#d32f2f;">⛔ 加入黑名單</label>
                    <label class="switch"><input type="checkbox" id="mem-blacklist"><span class="slider"></span></label>
                </div>
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button class="btn btn-del" id="btn-del-mem" onclick="deleteMember()" style="display:none;">刪除會員</button>
                <div style="display:flex; gap:10px;"><button class="btn btn-secondary" onclick="closeModal('memberModal')">取消</button><button class="btn btn-primary" style="width:auto;" onclick="saveMember()">儲存</button></div>
            </div>
        </div>
    </div>

    <div id="txModal" class="modal">
        <div class="modal-content">
            <h3 id="txModalTitle">消費紀錄</h3>
            <input type="hidden" id="tx-id">
            <div class="form-group"><label>日期</label><input type="date" id="tx-date-edit"></div>
            <div class="form-group"><label>類型</label><select id="tx-type-edit"><option>消費</option><option>儲值</option><option>購買課程</option><option>使用課程</option><option>產品</option></select></div>
            <div class="form-group"><label>項目</label><input id="tx-item-edit"></div>
            <div class="form-group"><label>金額</label><input type="number" id="tx-amt-edit"></div>
            <div class="form-group"><label>備註</label><input id="tx-note-edit"></div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button class="btn btn-del" onclick="deleteTxById()">刪除 (自動回補)</button>
                <div style="display:flex; gap:10px;"><button class="btn btn-secondary" onclick="closeModal('txModal')">取消</button><button class="btn btn-primary" style="width:auto;" onclick="saveTxEdit()">儲存</button></div>
            </div>
        </div>
    </div>

    <div id="addServiceModal" class="modal">
        <div class="modal-content">
            <h3>新增服務項目</h3>
            <div class="form-group"><label>分類</label><select id="new-svc-cat" disabled style="background:#eee;"><option value="nail">美甲</option><option value="skin">肌膚</option><option value="wax">除毛</option><option value="nail-event">美甲活動</option><option value="skin-event">肌膚活動</option><option value="wax-event">除毛活動</option></select></div>
            <div class="form-group"><label>項目名稱</label><input type="text" id="new-svc-name"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('addServiceModal')">取消</button><button class="btn btn-primary" style="width:auto; margin:0;" onclick="saveNewService()">確認新增</button></div>
        </div>
    </div>

    <div id="blockModal" class="modal">
        <div class="modal-content">
            <h3>新增不開放時段</h3>
            <div class="form-group"><label>日期</label><input type="date" id="block-date"></div>
            
            <div class="form-group" style="background:#e3f2fd; padding:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                <label style="margin:0; font-weight:bold; color:#1565c0;">全天公休 (00:00-23:59)</label>
                <label class="switch"><input type="checkbox" id="block-allday" onchange="toggleBlockTime()"><span class="slider"></span></label>
            </div>

            <div class="form-group" id="block-time-group"><label>時間 (起-迄)</label><div style="display:flex; gap:5px;"><input type="time" id="block-start"><input type="time" id="block-end"></div></div>
            <div class="form-group"><label>事由</label><input type="text" id="block-title" placeholder="例如：外出"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('blockModal')">取消</button><button class="btn btn-primary" style="width:auto; margin:0;" onclick="saveBlockTime()">儲存</button></div>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzDwyByp3GSfOE8w14yHhXiFI-jjD2tjN_xYmjD7YR1ADfAN1Mcg_esb55bKBCm27HhJA/exec'; //

        const defaultServices = [
            {cat:"nail", name:"手-不需卸甲", active:true}, {cat:"nail", name:"手-卸甲續作", active:true}, {cat:"nail", name:"手-卸甲不續作", active:true},
            {cat:"nail", name:"足-不需卸甲", active:true}, {cat:"nail", name:"足-卸甲續作", active:true}, {cat:"nail", name:"足-卸甲不續作", active:true},
            {cat:"nail", name:"手-延甲", active:true}, {cat:"nail", name:"手-十指全延", active:true}, {cat:"nail", name:"手-水晶延甲", active:true}, {cat:"nail", name:"足-延甲", active:true},
            {cat:"nail", name:"手-透明", active:true}, {cat:"nail", name:"手-單色", active:true}, {cat:"nail", name:"手-跳色", active:true}, {cat:"nail", name:"手-貓眼", active:true}, {cat:"nail", name:"手-鏡面", active:true}, {cat:"nail", name:"手-漸層", active:true}, {cat:"nail", name:"手-法式", active:true}, {cat:"nail", name:"手-造型", active:true},

            {cat:"nail", name:"手-基礎保養", active:true}, {cat:"nail", name:"手-嫩白保養", active:true}, {cat:"nail", name:"手-深層保養", active:true},

        function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }

        async function fetchData() {
            showLoading(true);
            try {
                const res = await fetch(GAS_URL + '?action=getAll');
                db = await res.json();
                init();
            } catch(e) { alert("連線失敗"); }
            showLoading(false);
        }

        async function postData(action, sheet, dataObj, id = null, extraParams = {}) {
            showLoading(true);
            const payload = { action: action, sheet: sheet, data: dataObj, id: id, ...extraParams };
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                await fetchData(); 
            } catch(e) { alert("儲存失敗"); }
            showLoading(false);
        }

        function getTodayString() {
            return new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replace(/\//g, '-');
        }

        function clean(val) {
            return String(val || '').replace(/[^0-9a-zA-Z]/g, '').toLowerCase();
        }

        function checkLogin() {
            if(document.getElementById('adminPassInput').value === '1229') {
                document.getElementById('loginOverlay').style.display = 'none';
                fetchData();
            } else alert('密碼錯誤');
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(pageId === 'dashboard') renderDashboard();
            if(pageId === 'members') renderMembers();
            if(pageId === 'transactions') renderTransactions();
            if(pageId === 'appointments') renderCalendar();
            if(pageId === 'settings') renderSettings(currentSettingsCat);

        // Dashboard (Fix: lowercase keys)

            const today = getTodayString();
            document.getElementById('todayDateStr').innerText = `今日預約 (${today.replace(/-/g,'/')})`;
            const list = document.getElementById('today-list');
            list.innerHTML = "";
            const apps = db.appointments.filter(a => a.date === today && a.status !== '已取消').sort((a,b) => a.time.localeCompare(b.time));
            
            if(apps.length === 0) { list.innerHTML = `<div style="text-align:center; color:#999; padding:20px;">今日無預約</div>`; return; }
            
            apps.forEach(app => {
                let badgeClass = (app.status === '待確認') ? 'status-pending' : 'status-confirmed';
                let statusBadge = `<span class="status-badge ${badgeClass}">${app.status || '已確認'}</span>`;
                
                list.innerHTML += `<div class="data-card" onclick="openEditAppModal('${app.id}')"><div class="app-card-header"><span>${app.time} ${statusBadge}</span><span>${app.name}</span></div><div class="app-card-body">項目：${app.item}<br>電話：${app.phone}<br><span class="app-card-note">備註：${app.note||'無'}</span></div><div class="app-card-actions"><button class="btn btn-edit" onclick="event.stopPropagation(); openEditAppModal('${app.id}')">修改/確認</button><button class="btn btn-del" onclick="event.stopPropagation(); deleteCurrentApp('${app.id}')">刪除</button></div></div>`;

        }

        // Transactions (萬能比對)
        function renderTransactions() {
            const list = document.getElementById('tx-list');
            list.innerHTML = "";
            [...db.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(t => {
                const tKey = clean(t.memberid);
                let m = db.members.find(m => {
                    const mId = clean(m.id);
                    const mPhone = clean(m.phone);
                    if (mId === tKey) return true;
                    if (mPhone.length > 5 && (mPhone.includes(tKey) || tKey.includes(mPhone))) return true;
                    if (m.name === t.memberid) return true;
                    return false;
                });
                const mName = m ? m.name : '未知';
                list.innerHTML += `<div class="data-card"><div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:5px;"><span>${t.date.replace(/-/g,'/')}</span><span>$${t.amount}</span></div><div style="font-size:1.1rem;color:var(--text-main);">${mName} - ${t.type}</div><div style="color:var(--text-sub);">${t.item} ${t.note?`(${t.note})`:''}</div><div style="text-align:right; margin-top:10px;"><button class="btn btn-edit" style="width:auto; padding:5px 10px; margin-right:5px;" onclick="openTxEdit('${t.id}')">修改</button><button class="btn btn-del" style="width:auto; padding:5px 10px;" onclick="deleteTx('${t.id}')">刪除</button></div></div>`;
            });
        }

        function saveTx() { 
            const memVal = document.getElementById('tx-mem-val').value; 
            if(!memVal) return alert("請輸入正確電話以選擇會員"); 
            const updateBalance = document.getElementById('tx-update-balance').checked;
            const data = [ Date.now().toString(), document.getElementById('tx-date').value, memVal, document.getElementById('tx-type').value, document.getElementById('tx-item').value, document.getElementById('tx-amt').value, document.getElementById('tx-note').value ];

        function deleteTx(id) { if(confirm("確定刪除此交易？(若當初有連動餘額，系統將自動回補/扣除款項)")) postData('delete', 'transactions', null, id, { sheet: 'transactions' }); }

        // Calendar
        let currentMonth = new Date();
        function changeMonth(n) { currentMonth.setMonth(currentMonth.getMonth()+n); renderCalendar(); }
        function renderCalendar() {
            const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
            document.getElementById('cal-month-title').innerText = `${y}年 ${m+1}月`;
            const grid=document.getElementById('calendar-view'); grid.innerHTML="";
            const days = new Date(y, m+1, 0).getDate();
            const first = new Date(y, m, 1).getDay();
            for(let i=0;i<first;i++) grid.innerHTML+=`<div class="cal-day" style="background:transparent;border:none;"></div>`;
            for(let d=1;d<=days;d++) {
                const monthStr = String(m+1).padStart(2, '0');
                const dayStr = String(d).padStart(2, '0');
                const dateStr = `${y}-${monthStr}-${dayStr}`;
                const apps = db.appointments.filter(a=>a.date === dateStr && a.status !== '已取消');
                const blocks = db.blockedSlots.filter(b=>b.date === dateStr);
                let html=`<div class="cal-day" onclick="openDayView('${dateStr}')"><span style="font-weight:bold;">${d}</span>`;
                blocks.forEach(b=>html+=`<div class="cal-badge blocked">${b.start}</div>`);
                apps.forEach(a=> {
                    let className = (a.status === '待確認') ? 'cal-badge pending' : 'cal-badge';
                    html+=`<div class="${className}">${a.time}</div>`;
                });
                grid.innerHTML+=html+`</div>`;
            }
        }
        function openDayView(date) {
            const apps = db.appointments.filter(a=>a.date === date && a.status !== '已取消').sort((a,b)=>a.time.localeCompare(b.time));
            const blocks = db.blockedSlots.filter(b=>b.date === date).sort((a,b)=>a.start.localeCompare(b.start));
            
            const editIcon = `<svg class="icon" style="margin:0; width:18px; height:18px;" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
            const delIcon = `<svg class="icon" style="margin:0; width:18px; height:18px;" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

            let html = `<h3>${date} 行程</h3>`;
            if(blocks.length > 0) {
                html += `<h4>保留時段</h4><ul>`;
                blocks.forEach((b) => html+=`<li style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;"><span>🚫 ${b.start}-${b.end} : ${b.title}</span><button class="btn-del" style="padding:8px 12px;" onclick="deleteBlock('${b.id}', '${date}')">${delIcon}</button></li>`);
                html+=`</ul>`;
            }
            if(apps.length > 0) {
                html += `<h4>預約列表</h4><ul>`;
                apps.forEach(a=> html+=`<li style="margin-bottom:15px;border-bottom:1px dashed #eee;padding-bottom:5px;display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:1.1rem;">${a.time} <span style="font-size:0.8rem; background:${a.status==='待確認'?'#FBC02D':'#388E3C'}; color:#fff; padding:2px 5px; border-radius:4px;">${a.status||'已確認'}</span> ${a.name} <br><small style="color:#999">${a.item}</small></span>
                    <div style="display:flex;">
                        <button class="btn-edit" style="padding:8px 12px; margin-right:5px;" onclick="openEditAppModal('${a.id}')">${editIcon}</button>
                        <button class="btn-del" style="padding:8px 12px;" onclick="deleteCurrentApp('${a.id}')">${delIcon}</button>
                    </div>
                </li>`);
                html+=`</ul>`;
            } else if(blocks.length===0) html+=`<p style="color:#999; text-align:center;">無行程</p>`;
            
            const opts = db.members.map(m => `<option value="${m.phone}" label="${m.name}">`).join('');
            html+=`<hr style="margin:20px 0;"><h4 style="margin-bottom:10px">手動新增預約</h4>
            <div class="form-group"><input type="time" id="new-app-time"></div>
            <div class="form-group"><label>搜尋會員 (選填，自動帶入)</label><input list="app-mem-list" id="app-search" oninput="autoFillApp()" style="width:100%"><datalist id="app-mem-list">${opts}</datalist></div>
            <div class="form-group"><input type="text" id="new-app-name" placeholder="姓名"></div>
            <div class="form-group"><input type="tel" id="new-app-phone" placeholder="電話"></div>
            <div class="form-group"><input type="text" id="new-app-item" placeholder="項目"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('commonModal')">關閉</button><button class="btn btn-primary" style="width:auto;" onclick="addManualApp('${date}')">新增</button></div>`;
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('commonModal').classList.add('open');
        }
        function autoFillApp() {
            const val = document.getElementById('app-search').value;
            const m = db.members.find(x => x.phone === val);
            if (m) {
                document.getElementById('new-app-name').value = m.name;
                document.getElementById('new-app-phone').value = m.phone;
            }
        }

        function initServices() { if(confirm("確定匯入？")) { const rows = defaultServices.map(s => [s.cat, s.name, s.active]); postData('initServices', 'services', rows).then(()=>alert("匯入完成")); } }
        function closeModal(id) { document.getElementById(id||'commonModal').classList.remove('open'); }
    </script>
