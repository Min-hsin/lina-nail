<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lina Nail 後台管理</title>
    <style>
        /* 樣式保持一致，新增時段按鈕樣式 */
        :root { --bg-color: #FFFBF0; --header-bg: #EFEBE9; --text-main: #4E342E; --text-sub: #8D6E63; --card-bg: #FFFFFF; --accent-color: #A1887F; --success: #4CAF50; --booked: #E57373; --closed: #9E9E9E; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 16px; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .icon { width: 22px; height: 22px; fill: currentColor; vertical-align: middle; margin-right: 5px; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-color); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: #fff; padding: 40px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(141, 110, 99, 0.15); text-align: center; }
        .login-input { padding: 12px; font-size: 1.2rem; margin: 20px 0; border: 1px solid #ccc; border-radius: 8px; width: 100%; text-align: center; outline: none;}
        header { position: sticky; top: 0; z-index: 1000; background-color: var(--header-bg); padding: 12px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; padding-top: env(safe-area-inset-top); }
        .nav-scroller { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
        .nav-btn { background: #fff; border: 1px solid #ddd; color: var(--text-sub); padding: 8px 15px; cursor: pointer; font-size: 0.95rem; font-weight: bold; border-radius: 20px; transition: 0.2s; display: flex; align-items: center; white-space: nowrap; }
        .nav-btn.active { background-color: var(--text-main); color: #fff; border-color: var(--text-main); }
        .btn-home { text-decoration: none; font-weight: bold; color: var(--text-main); font-size: 0.9rem; border: 1px solid var(--text-main); padding: 5px 10px; border-radius: 8px; }
        main { flex: 1; padding: 15px; padding-bottom: 80px; }
        .page-section { display: none; animation: fadeIn 0.3s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
        .card-container { display: flex; flex-direction: column; gap: 15px; }
        .data-card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.03); position: relative; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { font-size: 1.2rem; margin-bottom: 15px; }
        .app-card-header { display: flex; justify-content: space-between; font-weight: 900; font-size: 1.2rem; color: var(--text-main); margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
        .app-card-body { font-size: 1rem; line-height: 1.6; color: #555; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--text-main); color: #fff; width: 100%; margin-bottom: 15px; padding: 12px; font-weight: bold; }
        .btn-edit { background: #fff; border: 1px solid var(--accent-color); color: var(--accent-color); }
        .btn-del { background: #fff; border: 1px solid var(--danger); color: var(--danger); font-weight: bold; }
        .btn-secondary { background: #eee; color: #555; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day { background: #fff; border: 1px solid #eee; min-height: 100px; padding: 5px; cursor: pointer; border-radius: 6px; position: relative; }
        .cal-day.today { background: #FFF8E1; border: 2px solid #FFD54F; }
        .cal-badge { display: block; font-size: 0.8rem; background: var(--accent-color); color: #fff; padding: 4px; border-radius: 4px; margin-top: 2px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cal-badge.blocked { background: #BDBDBD; font-size: 0.75rem;} 
        
        /* 時段按鈕樣式 */
        .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .slot-btn { padding: 12px 5px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; font-size: 0.9rem; border: 1px solid #ddd; }
        .slot-btn.open { background: var(--success); color: white; border-color: var(--success); } /* 綠色：開放 */
        .slot-btn.closed { background: var(--closed); color: white; border-color: var(--closed); } /* 灰色：關閉 */
        .slot-btn.booked { background: var(--booked); color: white; cursor: not-allowed; opacity: 0.7; } /* 紅色：已約 */
        
        .settings-tab-nav { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px; overflow-x: auto; }
        .settings-tab-btn { background: none; border: none; padding: 8px 15px; cursor: pointer; font-size: 1rem; color: #888; white-space: nowrap; }
        .settings-tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--text-main); }
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fff; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal.open { display: flex; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-sub); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; outline:none; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loadingOverlay"><div class="spinner"></div><p style="margin-top: 15px; font-weight: bold; color: #555;">資料同步中...</p></div>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="border:none; margin-bottom:20px;">Lina Nail 後台</h2>
            <input type="password" id="adminPassInput" class="login-input" placeholder="請輸入密碼">
            <button class="btn btn-primary" onclick="checkLogin()">登入</button>
        </div>
    </div>

    <header>
        <div class="nav-scroller">
            <button class="nav-btn active" onclick="switchPage('dashboard')"><svg class="icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>首頁</button>
            <button class="nav-btn" onclick="switchPage('appointments')"><svg class="icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>預約行事曆</button>
            <button class="nav-btn" onclick="switchPage('booking_settings')"><svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>預約項目管理</button>
            <button class="nav-btn" onclick="switchPage('price_settings')"><svg class="icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>價目表設定</button>
            <button class="nav-btn" onclick="switchPage('members')"><svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>會員</button>
            <button class="nav-btn" onclick="switchPage('transactions')"><svg class="icon" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>消費</button>
        </div>
        <a href="index.html" class="btn-home">回前台</a>
    </header>

    <main>
        <div id="dashboard" class="page-section active">
            <h2 id="todayDateStr">今日預約</h2>
            <div id="today-list" class="card-container"></div>
        </div>

        <div id="appointments" class="page-section">
            <div class="calendar-header">
                <button class="btn btn-secondary" onclick="changeMonth(-1)">◀</button>
                <span id="cal-month-title"></span>
                <button class="btn btn-secondary" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-view"></div>
            <p style="text-align:center; color:#666; margin-top:10px;">點擊日期管理當日開放時段與預約</p>
        </div>

        <div id="booking_settings" class="page-section">
            <div class="data-card" style="margin-bottom:20px; background:#e8f5e9;">
                <h3>🛠️ 系統初始化</h3>
                <p style="margin-bottom:10px; color:#555;">一鍵匯入預設服務項目 (第一次必按)</p>
                <button class="btn btn-primary" onclick="initServices()">匯入預設項目</button>
            </div>
            <h3>⚙️ 預約項目管理 (工時/開關)</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', 'booking', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', 'booking', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', 'booking', this)">除毛</button>
                <button class="settings-tab-btn" onclick="renderSettings('nail-event', 'booking', this)">活動</button>
            </div>
            <div id="booking-settings-list"></div>
        </div>

        <div id="price_settings" class="page-section">
            <h3>💰 價目表管理 (名稱/價格)</h3>
            <div class="settings-tab-nav">
                <button class="settings-tab-btn active" onclick="renderSettings('nail', 'price', this)">美甲</button>
                <button class="settings-tab-btn" onclick="renderSettings('skin', 'price', this)">肌膚</button>
                <button class="settings-tab-btn" onclick="renderSettings('wax', 'price', this)">除毛</button>
                <button class="settings-tab-btn" onclick="renderSettings('nail-event', 'price', this)">活動</button>
            </div>
            <div id="price-settings-list"></div>
        </div>

        <div id="members" class="page-section">
            <button class="btn btn-primary" onclick="openMemberModal()">+ 新增會員</button>
            <input type="text" class="login-input" style="width:100%; text-align:left; margin-bottom:15px;" id="memSearch" placeholder="搜尋姓名或電話..." oninput="renderMembers()">
            <div id="member-list" class="card-container"></div>
        </div>

        <div id="transactions" class="page-section">
            <button class="btn btn-primary" onclick="openTxModal()">+ 新增消費 / 儲值 / 購課</button>
            <div id="tx-list" class="card-container"></div>
        </div>
    </main>

    <div id="commonModal" class="modal"><div class="modal-content" id="modalBody"></div></div>

    <div id="editBookingModal" class="modal">
        <div class="modal-content">
            <h3>編輯項目</h3>
            <input type="hidden" id="edit-id">
            <div class="form-group"><label>名稱</label><input type="text" id="edit-name"></div>
            <div class="form-group" id="edit-price-group"><label>價格 (前台顯示)</label><input type="text" id="edit-price"></div>
            <div class="form-group" id="edit-duration-group"><label>工時 (小時)</label><input type="number" step="0.5" id="edit-duration"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editBookingModal')">取消</button>
                <button class="btn btn-primary" onclick="saveServiceEdit()">儲存</button>
            </div>
        </div>
    </div>
    
    <div id="appModal" class="modal"><div class="modal-content"><h3>預約資訊</h3><input type="hidden" id="app-id"><input type="hidden" id="app-date-hidden"><div class="form-group"><label>狀態</label><select id="app-status"><option value="待確認">待確認</option><option value="已確認">已確認</option><option value="已取消">已取消</option></select></div><div class="form-group"><label>日期</label><input type="text" id="app-date-display" disabled></div><div class="form-group"><label>時間</label><input type="time" id="app-time"></div><div class="form-group"><label>姓名</label><input type="text" id="app-name"></div><div class="form-group"><label>電話</label><input type="text" id="app-phone"></div><div class="form-group"><label>項目</label><textarea id="app-item" rows="3"></textarea></div><div class="form-group"><label>備註</label><input type="text" id="app-note"></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteCurrentApp()">刪除</button><div style="display:flex; gap:10px;"><button class="btn btn-secondary" onclick="closeModal('appModal')">取消</button><button class="btn btn-primary" onclick="saveCurrentApp()">儲存</button></div></div></div></div>
     <div id="memberModal" class="modal"><div class="modal-content"><h3>會員</h3><input type="hidden" id="mem-id"><div class="form-group"><label>姓名</label><input id="mem-name"></div><div class="form-group"><label>電話</label><input id="mem-phone"></div><div class="form-group"><label>性別</label><select id="mem-gender"><option>女</option><option>男</option></select></div><div class="form-group"><label>生日</label><input type="text" id="mem-bday"></div><div class="form-group"><label>等級</label><select id="mem-level"><option>一般會員</option><option>黃金會員</option><option>白金會員</option><option>鑽石會員</option></select></div><div class="form-group"><label>剩餘課程</label><textarea id="mem-courses"></textarea></div><div class="form-group"><label>黑名單</label><label class="switch"><input type="checkbox" id="mem-blacklist"><span class="slider"></span></label></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteMember()">刪除</button><button class="btn btn-primary" onclick="saveMember()">儲存</button></div></div></div>
     <div id="txModal" class="modal"><div class="modal-content"><h3>消費紀錄</h3><input type="hidden" id="tx-id"><div class="form-group"><label>日期</label><input type="date" id="tx-date-edit"></div><div class="form-group"><label>類型</label><select id="tx-type-edit"><option>消費</option><option>儲值</option><option>購買課程</option><option>使用課程</option><option>產品</option></select></div><div class="form-group"><label>項目</label><input id="tx-item-edit"></div><div class="form-group"><label>金額</label><input type="number" id="tx-amt-edit"></div><div class="form-group"><label>備註</label><input id="tx-note-edit"></div><div class="modal-footer"><button class="btn btn-del" onclick="deleteTxById()">刪除</button><button class="btn btn-primary" onclick="saveTxEdit()">儲存</button></div></div></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzDwyByp3GSfOE8w14yHhXiFI-jjD2tjN_xYmjD7YR1ADfAN1Mcg_esb55bKBCm27HhJA/exec'; 

        // 包含 Group 的預設服務
        const defaultServices = [
             // 美甲
            {id:'s1', cat:'nail', group:'nail-basic', name:'手-不需卸甲', price:'', duration:0, active:true},
            {id:'s2', cat:'nail', group:'nail-basic', name:'手-卸甲續作', price:'$200', duration:0.5, active:true},
            {id:'s3', cat:'nail', group:'nail-basic', name:'手-卸甲不續作', price:'$500', duration:1, active:true},
            {id:'s4', cat:'nail', group:'nail-basic', name:'足-不需卸甲', price:'', duration:0, active:true},
            {id:'s5', cat:'nail', group:'nail-basic', name:'足-卸甲續作', price:'$300', duration:0.5, active:true},
            {id:'s6', cat:'nail', group:'nail-basic', name:'足-卸甲不續作', price:'$600', duration:1, active:true},
            
            {id:'s7', cat:'nail', group:'nail-ext', name:'手-延甲', price:'$100/指', duration:0.5, active:true},
            {id:'s8', cat:'nail', group:'nail-ext', name:'手-十指全延', price:'', duration:1.5, active:true},
            
            {id:'s9', cat:'nail', group:'nail-style', name:'手-透明', price:'$800', duration:2, active:true},
            {id:'s10', cat:'nail', group:'nail-style', name:'手-單色', price:'$1000', duration:2, active:true},
            {id:'s11', cat:'nail', group:'nail-style', name:'手-跳色', price:'$100', duration:2, active:true},
            {id:'s12', cat:'nail', group:'nail-style', name:'手-貓眼', price:'$200', duration:2, active:true},
            {id:'s13', cat:'nail', group:'nail-style', name:'手-造型', price:'$50 up', duration:2.5, active:true},
            
            {id:'s14', cat:'nail', group:'nail-care', name:'手-基礎保養', price:'$600', duration:1, active:true},
            {id:'s15', cat:'nail', group:'nail-care', name:'手-嫩白保養', price:'$900', duration:1.5, active:true},
            
            {id:'s16', cat:'skin', group:'skin-basic', name:'臉部清潔(新客體驗價)', price:'$999', duration:1.5, active:true},
            {id:'s17', cat:'skin', group:'skin-basic', name:'韓國小氣泡深層清潔', price:'$1200', duration:1.5, active:true},
            {id:'s18', cat:'skin', group:'skin-high', name:'黃金24K金箔課程', price:'$2300', duration:2, active:true},
            {id:'s19', cat:'skin', group:'skin-high', name:'木乃伊緊緻小臉', price:'$2100', duration:2, active:true},
            
            {id:'s20', cat:'wax', group:'wax-body', name:'腋下', price:'$500', duration:0.5, active:true},
            {id:'s21', cat:'wax', group:'wax-body', name:'小手臂', price:'$800', duration:1, active:true},
            {id:'s22', cat:'wax', group:'wax-private', name:'比基尼線', price:'$1500', duration:1, active:true},
            {id:'s23', cat:'wax', group:'wax-private', name:'巴西式全除', price:'$2000', duration:2, active:true},

            // 活動
            {id:'s24', cat:'nail-event', group:'event', name:'打卡折50', price:'', duration:0, active:true},
            {id:'s25', cat:'nail-event', group:'event', name:'本月特惠款', price:'$1000', duration:2.5, active:true},
        ];

        let db = { members: [], transactions: [], appointments: [], services: [], blockedSlots: [] };

        function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }
        
        async function fetchData() {
            showLoading(true);
            try { const res = await fetch(GAS_URL + '?action=getAll'); db = await res.json(); init(); } catch(e) { alert("連線失敗"); }
            showLoading(false);
        }

        async function postData(action, sheet, dataObj, id=null, extra={}) {
            showLoading(true);
            const payload = { action: action, sheet: sheet, data: dataObj, id: id, ...extra };
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            await fetchData();
            showLoading(false);
        }
        
        // ... (Basic functions: checkLogin, switchPage, getTodayString same as before) ...
        function checkLogin() { if(document.getElementById('adminPassInput').value === '1229') { document.getElementById('loginOverlay').style.display='none'; fetchData(); } else alert('密碼錯誤'); }

        function openServiceModal(id, mode) {

        // This is the NEW Modal with Slot Buttons
        function openDayView(date) {
            // Find existing blocks
            const blocks = db.blockedSlots.filter(b => String(b.date) === date && b.title === 'manual_lock');
            const bookedApps = db.appointments.filter(a => a.date === date && a.status !== '已取消');

            let html = `<h3>${date} 管理</h3>
            <p style="margin-bottom:10px;">點擊綠色時段以關閉，點擊灰色以開啟。</p>
            <div class="slot-grid">
                ${renderSlotButton(date, '08:00', blocks, bookedApps)}
                ${renderSlotButton(date, '20:30', blocks, bookedApps)}
            </div>
            <hr>
            <div class="slot-grid">`;
            
            // Standard slots
            let time = 10 * 60; // 10:00 in minutes
            const endTime = 18 * 60; // 18:00
            
            while(time <= endTime) {
                const hh = Math.floor(time/60).toString().padStart(2,'0');
                const mm = (time%60).toString().padStart(2,'0');
                const timeStr = `${hh}:${mm}`;
                html += renderSlotButton(date, timeStr, blocks, bookedApps);
                time += 30;
            }
            html += `</div>`;
            
            // Add manual booking button
            html += `<hr><button class="btn btn-primary" onclick="showManualAdd('${date}')">手動新增預約</button>`;
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('commonModal').classList.add('open');
        }

        function renderSlotButton(date, time, blocks, apps) {
            // Check if booked
            const isBooked = apps.some(a => a.time === time);
            // Check if blocked manually
            const isBlocked = blocks.some(b => b.start === time);
            
            let className = 'slot-btn open';
            let onclick = `toggleSlotState('${date}', '${time}', true)`; // true = block it
            
            if (isBooked) {
                className = 'slot-btn booked';
                onclick = '';
            } else if (isBlocked) {
                className = 'slot-btn closed';
                onclick = `toggleSlotState('${date}', '${time}', false)`; // false = unblock it
            }
            
            return `<div class="${className}" onclick="${onclick}">${time}</div>`;
        }

        function toggleSlotState(date, time, shouldBlock) {
            showLoading(true);
            const payload = { action: 'toggleSlot', date: date, time: time, block: shouldBlock };
            fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) }).then(() => {
                fetchData().then(() => openDayView(date)); // Reload and re-render modal
            });
        }
        
        // ... (Include other modals, openTxModal, etc. from previous version) ...
        function closeModal(id) { document.getElementById(id||'commonModal').classList.remove('open'); }
        // (Ensure renderCalendar is fully implemented as in previous version)
        let currentMonth = new Date();
        function changeMonth(n) { currentMonth.setMonth(currentMonth.getMonth()+n); renderCalendar(); }
        function renderCalendar() {
            const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
            document.getElementById('cal-month-title').innerText = `${y}年 ${m+1}月`;
            const grid=document.getElementById('calendar-view'); grid.innerHTML="";
            const days = new Date(y, m+1, 0).getDate();
            const first = new Date(y, m, 1).getDay();
            for(let i=0;i<first;i++) grid.innerHTML+=`<div class="cal-day" style="background:transparent;border:none;"></div>`;
            for(let d=1;d<=days;d++) {
                const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                // Count apps/blocks for badges (Simplified)
                let html=`<div class="cal-day" onclick="openDayView('${dateStr}')"><span style="font-weight:bold;">${d}</span></div>`;
                grid.innerHTML+=html;
            }
        }
    </script>
